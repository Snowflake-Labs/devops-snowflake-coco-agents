[project]
name = "coco-demo"
version = "0.1.0"
description = "Demo app for the coco-agent scan/fix workflow"
requires-python = ">=3.10"
dependencies = ["snowflake-connector-python>=3.0"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# S = bandit security rules — reliably catches Issues 2 and 3 in app.py
select = ["E", "F", "S"]
