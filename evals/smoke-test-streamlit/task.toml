version = "1.0"

[metadata]
name = "smoke-test-streamlit"
description = "Verify Streamlit demo generation routes 3 issues to 3 distinct fix modes"
tags = ["devops-coco-agents", "smoke-test", "determinism"]

[agent]
timeout_sec = 300

[verifier]
timeout_sec = 120

[environment]
dockerfile = "../docker/Dockerfile"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 4096
storage_mb = 5120
