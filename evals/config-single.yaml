# Quick sanity-check config — runs one task once to verify eval infra is working.
#
# Run from evals/:
#   cortex-eval run --config config-single.yaml
#
# Use this to confirm Docker builds, trajectory paths, and test wiring before
# running the full determinism suite (config.yaml, n_attempts=5).
jobs_dir: "jobs"

agents:
    - name: "devops-coco-agents-skill"
      import_path: "cortex_code_eval.adapters:CortexCode"
      model_name: "claude-sonnet-4-6"
      kwargs:
          auto_accept_plans: true

environment:
    import_path: "cortex_code_eval.adapters:CortexCodeEnvironment"

# Dataset path is relative to the evals/ working directory.
# Single task to keep run time short for infra checks.
tasks:
    - path: "scaffold/smoke-test-de"

n_attempts: 1
