name: Deploy docs
on:
    push:
        branches: [main]
        paths: ["docs/**", "mkdocs.yml"]
jobs:
    deploy:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - run: pip install mkdocs-material pymdown-extensions
            - run: mkdocs gh-deploy --force
